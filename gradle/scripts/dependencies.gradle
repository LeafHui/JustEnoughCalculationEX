apply from: 'gradle/scripts/helpers.gradle'

repositories {
    // Other repositories described by default:
    // CleanroomMC: https://maven.cleanroommc.com
    exclusiveContent {
        forRepository {
            maven {
                name 'CurseMaven'
                url 'https://cursemaven.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name 'Modrinth'
                url 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name 'GTCEu Maven'
        url 'https://maven.gtceu.com'
    }
    maven {
        name 'Cleanroom Maven'
        url 'https://maven.cleanroommc.com'
    }
    maven {
        name 'BlameJared Maven'
        url 'https://maven.blamejared.com'
    }
    maven {
        name 'GTNH Maven'
        url 'https://nexus.gtnewhorizons.com/repository/public/'
    }
    maven {
        name 'Covers Maven'
        url 'https://maven.covers1624.net'
    }
    mavenCentral()
    mavenLocal() // Must be last for caching to work
}

dependencies {
    // JEI / HEI API (compile against the standard JEI 1.12.2 API; HEI is a runtime drop-in)
    compileOnly 'mezz.jei:jei_1.12.2:4.16.1.302'

    // Just Enough Calculation (the mod we enhance)
    implementation rfg.deobf('curse.maven:just-enough-calculation-242223:3524685')

    // GregTech is required at runtime only (declared in @Mod dependencies). GregTech-specific
    // classes are accessed reflectively, so no compile-time dependency is needed here.

}
