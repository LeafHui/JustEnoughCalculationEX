# Gradle Properties
org.gradle.jvmargs = -Xmx3G

# Source Options
# Use Modern Java(9+) Syntax (Courtesy of Jabel)
use_modern_java_syntax = false
# Spotless automatically refactors your project from java code to jsons for a tidied, uniformed look
spotless = false
# Spotless Options
cleanthat = false

# Compilation Options
generate_sources_jar = true
generate_javadocs_jar = false

# Mod Information
mod_version = 0.2.1
root_package = dev.jecaex
mod_id = jecaex
mod_name = Just Enough Calculation EX
mod_artifact_name = jecaex

# Mod Metadata (Optional)
mod_description = GregTech addon for Just Enough Calculation: fixes recipe catalyst matching and adds a BoM-style crafting tree.
mod_url = https://github.com/LeafHui/JustEnoughCalculationEX
mod_update_json =
mod_authors = JecaEx Team
mod_credits =
mod_logo_path =

# Mapping Properties
mapping_channel = stable
mapping_version = 39
use_dependency_at_files = true

# Run Configurations
minecraft_username = Developer
extra_jvm_args =
extra_tweak_classes =

# Maven Publishing
publish_to_maven = false
publish_to_local_maven = false
maven_name = JecaExMaven
maven_url = https://example.com/maven

# Publishing
release_type = alpha
publish_with_changelog = false
client_side = true
server_side = true

publish_to_curseforge = false
curseforge_project_id =
curseforge_debug = false

publish_to_modrinth = false
modrinth_project_id =
modrinth_sync_readme = false
modrinth_debug = false

# Modify Minecraft Sources
change_minecraft_sources = false

# Tags
use_tags = false
tag_class_name = ${root_package}.${mod_id}.Tags

# Access Transformers
use_access_transformer = false
access_transformer_locations = ${mod_id}_at.cfg

# Mixins
use_mixins = true
generate_mixins_json = false
mixin_booter_version = 10.6
mixin_package = ${root_package}.mixin
mixin_refmap = mixins.${mod_id}.refmap.json

# Coremods (not a coremod: our mixin is registered via ILateMixinLoader, discovered by MixinBooter
# through Forge's ASMDataTable during mod loading — no FMLCorePlugin manifest needed)
is_coremod = false
coremod_includes_mod = false
coremod_plugin_class_name =

# AssetMover
use_asset_mover = false
asset_mover_version = 2.5
