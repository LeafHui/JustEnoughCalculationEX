plugins {
    id 'java-library'
    id 'dev.architectury.loom' version '1.3-SNAPSHOT'
}

group = maven_group
version = "${mod_version}-mc${minecraft_version}"

base {
    archivesName = 'Just Enough Calculation EX'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
}

loom {
    silentMojangMappingsLicense()

    runs {
        client {
            client()
            ideConfigGenerated(true)
            runDir('run/client')
        }
        server {
            server()
            ideConfigGenerated(true)
            runDir('run/server')
            programArg '--nogui'
        }
    }

    forge {
        mixinConfig 'jecaex.mixins.json'
    }
}

repositories {
    mavenCentral()
    maven { name = 'ParchmentMC'; url = 'https://maven.parchmentmc.org' }
    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com' }
    maven { name = 'Architectury'; url = 'https://maven.architectury.dev' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${minecraft_version}:${parchment_version}@zip")
    }
    forge "net.minecraftforge:forge:${forge_version}"

    annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"
    compileOnly "org.spongepowered:mixin:${mixin_version}"
    compileOnly 'org.jetbrains:annotations:24.0.0'

    // JEC 1.20.1 (built locally from its 1.20.1 branch; not bundled in our jar)
    compileOnly files('libs/jecalculation-4.0.4.jar')
    modRuntimeOnly files('libs/jecalculation-4.0.4.jar')

    modImplementation "dev.architectury:architectury-forge:${architectury_version}"

    modCompileOnly "mezz.jei:jei-1.20.1-common-api:${jei_version}"
    modCompileOnly "mezz.jei:jei-1.20.1-forge-api:${jei_version}"
    modRuntimeOnly "mezz.jei:jei-1.20.1-forge:${jei_version}"

}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

processResources {
    filesMatching('META-INF/mods.toml') {
        expand(
            'mod_id': mod_id,
            'mod_name': mod_name,
            'mod_version': "${mod_version}-mc${minecraft_version}",
            'mod_description': 'Adds a full-screen BoM-style crafting tree to Just Enough Calculation.',
            'mod_url': 'https://github.com/LeafHui/JustEnoughCalculationEX',
            'mod_license': 'LGPL-3.0'
        )
    }
}

jar {
    from('LICENSE') {
        into 'META-INF'
    }
    from('THIRD_PARTY_NOTICES.md') {
        into 'META-INF'
    }
}
